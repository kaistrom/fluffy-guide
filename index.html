<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form</title>
  <!-- Telegram Web App SDK લિંક -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: var(--tg-theme-bg-color, #f4f4f9);
      color: var(--tg-theme-text-color, #222);
    }
    .input-box {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h3>કસ્ટમ રજીસ્ટ્રેશન ફોર્મ</h3>
  
  <div class="input-box">
    <label>પૂરું નામ:</label>
    <input type="text" id="fullName" placeholder="તમારું નામ લખો">
  </div>

  <div class="input-box">
    <label>મોબાઈલ નંબર:</label>
    <input type="tel" id="mobile" placeholder="૧૦ અંકનો નંબર">
  </div>

  <button onclick="submitData()">સબમિટ કરો</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // આખા મોબાઈલ સ્ક્રીન પર એપ ખોલવા માટે

    function submitData() {
      const name = document.getElementById('fullName').value;
      const phone = document.getElementById('mobile').value;
      const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "Unknown";

      if (!name || !phone) {
        tg.showAlert("કૃપા કરીને બધી વિગતો ભરો!");
        return;
      }

      // આ ડેટા તમે સીધો Apps Script પર મોકલી શકો અથવા બોટને પાછો આપી શકો
      const payload = { userId: userId, name: name, phone: phone };
      
      tg.sendData(JSON.stringify(payload)); // ડેટા બોટને પાછો મોકલશે
      tg.close(); // ફોર્મ બંધ થઈ જશે
    }
  </script>
</body>
</html>
