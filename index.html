<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: var(--tg-theme-bg-color, #f4f4f9);
      color: var(--tg-theme-text-color, #222);
    }
    .input-box {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h3>Registration Form</h3>
  
  <div class="input-box">
    <label>Puru Naam:</label>
    <input type="text" id="fullName" placeholder="Naam lakho">
  </div>

  <div class="input-box">
    <label>Mobile Number:</label>
    <input type="tel" id="mobile" placeholder="Mobile number lakho">
  </div>

  <button onclick="submitData()">Submit</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function submitData() {
      const name = document.getElementById('fullName').value;
      const phone = document.getElementById('mobile').value;

      if (!name || !phone) {
        alert("Badhi vigat bharo!");
        return;
      }

      alert("Form bharai gayu: " + name + " (" + phone + ")");
      if (tg.close) tg.close();
    }
  </script>
</body>
</html>
